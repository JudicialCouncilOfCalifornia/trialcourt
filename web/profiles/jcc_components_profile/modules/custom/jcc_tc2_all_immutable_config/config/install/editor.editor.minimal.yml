langcode: en
status: true
dependencies:
  config:
    - filter.format.minimal
  module:
    - ckeditor5
format: minimal
editor: ckeditor5
settings:
  toolbar:
    items:
      - bold
      - italic
      - removeFormat
      - '|'
      - link
      - '|'
      - numberedList
      - bulletedList
      - '|'
      - paragraphs_inline_entity_form
      - '|'
      - sourceEditing
      - '|'
      - underline
      - strikethrough
      - superscript
      - subscript
  plugins:
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: false
        styles: false
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<a hreflang target data-entity-bundle data-link-*>'
        - '<ol dir>'
        - '<ul dir>'
        - '<p dir>'
        - '<drupal-entity data-entity-type data-embed-button>'
    editor_advanced_link_link:
      enabled_attributes:
        - aria-label
        - id
        - rel
        - target
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
image_upload:
  status: false

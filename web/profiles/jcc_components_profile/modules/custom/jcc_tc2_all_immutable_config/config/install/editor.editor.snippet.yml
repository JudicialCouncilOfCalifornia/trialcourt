langcode: en
status: true
dependencies:
  config:
    - filter.format.snippet
  module:
    - ckeditor5
format: snippet
editor: ckeditor5
settings:
  toolbar:
    items:
      - bold
      - italic
      - removeFormat
      - style
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - blockQuote
      - '|'
      - sourceEditing
  plugins:
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<ul type dir>'
        - '<ol type dir>'
        - '<blockquote dir>'
        - '<a hreflang target data-entity-bundle data-link-*>'
        - '<p dir>'
    ckeditor5_style:
      styles:
        -
          label: Callout
          element: '<blockquote class="blockquote--callout">'
        -
          label: 'Primary Button'
          element: '<a class="jcc-button--primary button button--primary">'
        -
          label: 'Secondary Button'
          element: '<a class="jcc-button--secondary button button--secondary">'
        -
          label: 'CTA Link'
          element: '<a class="jcc-button--cta-link button button--text">'
        -
          label: Blockquote
          element: '<blockquote class="blockquote">'
    editor_advanced_link_link:
      enabled_attributes:
        - aria-label
        - id
        - rel
        - target
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
image_upload:
  status: false

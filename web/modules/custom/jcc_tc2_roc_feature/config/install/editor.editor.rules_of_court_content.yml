langcode: en
status: true
dependencies:
  config:
    - filter.format.rules_of_court_content
  module:
    - ckeditor5
format: rules_of_court_content
editor: ckeditor5
settings:
  toolbar:
    items:
      - bold
      - italic
      - underline
      - strikethrough
      - removeFormat
      - '|'
      - heading
      - style
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - insertTable
      - horizontalLine
      - '|'
      - sourceEditing
      - '|'
      - fullscreen
  plugins:
    ckeditor5_heading:
      enabled_headings:
        - heading3
        - heading4
        - heading5
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: true
        styles: false
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<span>'
    ckeditor5_style:
      styles:
        -
          label: Normal
          element: '<p class="normal">'
        -
          label: 'Subdivision Heading'
          element: '<p class="subdivheading">'
        -
          label: 'Subdivision Text'
          element: '<p class="subdivtext">'
        -
          label: 'Paragraph List'
          element: '<p class="paragraphlist">'
        -
          label: 'Paragraph No List'
          element: '<p class="paragraphnolist">'
        -
          label: 'Subparagraph List'
          element: '<p class="subparagraphlist">'
        -
          label: 'Subparagraph No List'
          element: '<p class="subparagraphnolist">'
        -
          label: 'Item List'
          element: '<p class="itemlist">'
        -
          label: 'Item No List'
          element: '<p class="itemnolist">'
        -
          label: 'SubItem List'
          element: '<p class="itemsublist">'
        -
          label: 'SubItem No List'
          element: '<p class="itemsubnolist">'
        -
          label: 'Numbered List (paragraph)'
          element: '<p class="numberedlist">'
        -
          label: 'Subd History'
          element: '<p class="subdhist">'
        -
          label: 'Rule History'
          element: '<p class="rulehist">'
        -
          label: 'AdvComm Heading'
          element: '<p class="advcommheader">'
        -
          label: 'AdvComm Text (paragraph)'
          element: '<p class="advcommtext">'
        -
          label: 'Unordered List'
          element: '<ul class="paragraphlist">'
        -
          label: 'Numbered List (list)'
          element: '<ol class="numberedlist">'
        -
          label: 'AdvComm Text (list)'
          element: '<ol class="advcommtext">'
        -
          label: 'Add grid/borders'
          element: '<table class="add-borders">'
    editor_advanced_link_link:
      enabled_attributes: {  }
    jcc_ckeditor_classes:
      enabled: true
      tags: p
image_upload:
  status: false

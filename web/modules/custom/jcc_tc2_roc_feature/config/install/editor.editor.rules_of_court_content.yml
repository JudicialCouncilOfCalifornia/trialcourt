langcode: en
status: false
dependencies:
  config:
    - filter.format.rules_of_court_content
  module:
    - ckeditor5
format: rules_of_court_content
editor: ckeditor5
settings:
  toolbar:
    items:
      - bold
      - italic
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - blockQuote
      - drupalInsertImage
      - '|'
      - sourceEditing
      - style
      - '|'
      - code
  plugins:
    ckeditor5_imageResize:
      allow_resize: true
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<cite>'
        - '<dl>'
        - '<dt>'
        - '<dd>'
        - '<h2 id="jump-*">'
        - '<h3 id>'
        - '<h4 id>'
        - '<h5 id>'
        - '<h6 id>'
        - '<a hreflang>'
        - '<blockquote cite>'
    ckeditor5_style:
      styles:
        -
          label: Subheading
          element: '<p class="rulesubheading">'
    editor_advanced_link_link:
      enabled_attributes: {  }
image_upload:
  status: false

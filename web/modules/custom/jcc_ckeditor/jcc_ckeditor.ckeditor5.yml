jcc_ckeditor_classes:
  ckeditor5:
    plugins:
      - htmlSupport.GeneralHtmlSupport
  drupal:
    label: Arbitrary classes
    library: core/ckeditor5.htmlSupport
    class: Drupal\jcc_ckeditor\Plugin\CKEditor5Plugin\ArbitraryClasses
    elements:
      - <p class>
      - <ul class>
      - <ol class>
      - <h2 class>
      - <h3 class>
      - <h4 class>
      - <h5 class>
      - <h6 class>
      - <table class>
    conditions:
      requiresConfiguration:
        enabled: true

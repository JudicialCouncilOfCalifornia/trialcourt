services:
  logger.channel.jcc_subscriptions:
    parent: logger.channel_base
    arguments: ['jcc_subscriptions']
  jcc_subscriptions.digestcron:
    class: Drupal\jcc_subscriptions\Services\JCCSubscriptionsDigestCron
    arguments:
      - '@state'
      - '@config.factory'
      - '@logger.factory'
      - '@queue'
      - '@renderer'
      - '@tempstore.shared'
      - '@password_generator'
      - '@datetime.time'

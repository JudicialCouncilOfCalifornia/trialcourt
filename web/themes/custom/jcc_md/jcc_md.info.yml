name: jcc_md
description: A theme based on JCCBase.
screenshot: screenshot.png
core_version_requirement: ^9 || ^10
# version: VERSION
engine: twig
type: theme
base theme: jcc_base

regions:
  logo: 'Logo'
  header: Header
  messaging: 'Messaging'
  breadcrumb: 'Breadcrumb' # Disabled as a block but in use
  title: 'Title' # Disabled block and not in use
  tabs: 'Tabs'
  left_sidebar: 'Left Sidebar'
  content: 'Content'
  content_below: 'Content: Below'
  drawer: 'Drawer'
  secondary_footer: 'Secondary Footer'
  footer: 'Footer'

libraries:
  - jcc_base/style
  - jcc_base/courtyard
  - jcc_md/style

ckeditor_stylesheets:
  - assets/css/jcc_md.style.css

# CKEditor 5 loads this on the admin page: the ckeditor_stylesheets above,
# scoped to .ck-content by the theme build (see jcc_base/scripts/ckeditor5-css.js).
ckeditor5-stylesheets:
  - assets/css/ckeditor5.css
